<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GradX · Research Hub</title>

  <!-- IBM Plex Sans Arabic for Arabic text, Inter for English (same as the Figma design system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Libraries load first. "defer" keeps them in this exact order and runs them after the HTML is parsed -->
  <!-- Lenis: smooth scrolling (github.com/darkroomengineering/lenis) — its CSS is copied into styles.css -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js" defer></script>
  <!-- GSAP + plugins: animation engine (github.com/greensock/GSAP) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
  <!-- Our code runs last, so Lenis and gsap already exist when it starts -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <!-- data-lenis-prevent: the sidebar has its own scroll, so Lenis leaves it alone -->
    <aside class="sidebar" id="sidebar" data-lenis-prevent>
      <a class="logo" href="#dashboard">
        <!-- GradX mark: two leaves crossing to form the "X" — teal under, orange over, a water drop where they meet (original logo, drawn in SVG) -->
        <svg class="logo__mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <rect x="0.5" y="0.5" width="39" height="39" rx="11.5" class="logo__bg" />
          <g transform="rotate(-42 20 20)">
            <path d="M20 3.5 C25.5 10 25.5 28 20 36.5 C14.5 28 14.5 10 20 3.5 Z" class="logo__leaf-teal" />
            <path d="M20 8 L20 32" class="logo__vein" />
          </g>
          <g transform="rotate(42 20 20)">
            <path d="M20 3.5 C25.5 10 25.5 28 20 36.5 C14.5 28 14.5 10 20 3.5 Z" class="logo__leaf-orange" />
            <path d="M20 8 L20 32" class="logo__vein" />
          </g>
          <circle cx="20" cy="20" r="3" class="logo__drop" />
          <circle cx="19.1" cy="19.1" r="0.9" class="logo__drop-shine" />
        </svg>
        <span class="logo__text">
          <strong>GradX</strong>
          <small>RESEARCH HUB</small>
        </span>
      </a>

      <nav class="nav" aria-label="Main menu" data-i18n-aria="mainMenu">
        <p class="eyebrow eyebrow--muted" data-i18n="mainMenu">MAIN MENU</p>
        <!-- Filled by script.js depending on the role (student / supervisor) -->
        <ul class="nav__list" id="nav-list"></ul>
      </nav>

      <div class="sidebar__footer">
        <ul class="nav__list" id="nav-footer"></ul>
      </div>
    </aside>

    <!-- Dark overlay behind the sidebar on small screens -->
    <div class="backdrop" id="backdrop"></div>

    <!-- ========== MAIN COLUMN ========== -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" data-i18n-aria="openMenu"></button>

        <label class="search">
          <span class="search__icon" data-icon="search"></span>
          <input type="search" id="global-search" placeholder="Search projects, tasks, people…" data-i18n-ph="search" />
        </label>

        <div class="topbar__right">
          <!-- Language switch: English ⇄ Arabic (the choice is remembered) -->
          <button class="lang-btn" id="lang-btn" type="button" data-action="toggle-lang"></button>
          <button class="icon-btn" aria-label="Notifications" data-i18n-aria="notifications">
            <span data-icon="bell"></span>
            <span class="dot"></span>
          </button>
          <span class="divider"></span>

          <!-- User menu -->
          <div class="user" id="user">
            <button class="user__btn" id="user-btn" aria-haspopup="true" aria-expanded="false">
              <span class="user__meta">
                <strong id="user-name"></strong>
                <small id="user-role"></small>
              </span>
              <span class="avatar avatar--md" id="user-avatar"></span>
              <span data-icon="chevronDown" class="user__chev"></span>
            </button>
            <!-- The role comes from the login now (no switching here), so each role only sees its own permissions -->
            <div class="menu" id="user-menu" role="menu">
              <a class="menu__item" href="#profile" role="menuitem" id="menu-profile" data-i18n="profile">Profile</a>
              <button class="menu__item" data-action="logout" role="menuitem" data-i18n="logout">Log out</button>
            </div>
          </div>
        </div>
      </header>

      <!-- Each page is rendered into here by script.js -->
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
